<title>Briefing Marchés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Charte 4884. Layout: one narrow column of sections under a pine-green header band
     (the same in both themes); the band carries the as-of time so a stale page is
     recognisable. Wide tables scroll inside their own container. Gold is earned: it is
     text only on the pine band and in the dark theme, a rule/dot/border elsewhere. */
  :root {
    /* brand */
    --color-dark: #1A3330;
    --color-dark-hover: #142926;
    --color-mid: #2A5446;
    --color-cream: #F5F1E8;
    --color-card: #FAFAF5;
    --color-gold: #C9A84C;
    --color-gold-hover: #B08A30;
    --color-danger: #C0392B;
    --glow: rgba(201, 168, 76, 0.07);
    /* theme surfaces */
    --bg: #F5F1E8;
    --surface: #FAFAF5;
    --ink: #1A2B27;
    --muted: #4A6E60;
    --line: #DDD9CC;
    --tag-ink: #1A3330;
    --focus: #2A5446;
    --pos: #2A5446;
    --neg: #C9A84C;
    --neg-edge: #B08A30;
    --warn-bg: #F7EBCB;
    --warn-ink: #5C4410;
    --warn-line: #C9A84C;
    /* header band: pine green in both themes, so these do not change with the theme */
    --band-ink: #FFFFFF;
    --band-muted: #BFC6C5;
    --band-warn-bg: #364634;
    --band-warn-ink: #F5E6B3;
    --band-warn-line: #C9A84C;
    --band-stale-bg: #C0392B;
    --band-stale-ink: #FFFFFF;
    --band-stale-line: #F2A99F;
    /* type */
    --font-head: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #142926;
      --surface: #1A3330;
      --ink: #F5F1E8;
      --muted: #BDC3C2;
      --line: rgba(255, 255, 255, 0.12);
      --tag-ink: #C9A84C;
      --focus: #C9A84C;
      --pos: #4A8A73;
      --neg: #C9A84C;
      --neg-edge: #C9A84C;
      --warn-bg: #2D3B2B;
      --warn-ink: #EBD9A0;
      --warn-line: #6B5E2C;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #142926;
    --surface: #1A3330;
    --ink: #F5F1E8;
    --muted: #BDC3C2;
    --line: rgba(255, 255, 255, 0.12);
    --tag-ink: #C9A84C;
    --focus: #C9A84C;
    --pos: #4A8A73;
    --neg: #C9A84C;
    --neg-edge: #C9A84C;
    --warn-bg: #2D3B2B;
    --warn-ink: #EBD9A0;
    --warn-line: #6B5E2C;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.65;
    font-variant-numeric: tabular-nums;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 40px;
  }
  main { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
  h1, h2, h3 { font-family: var(--font-head); margin: 0; line-height: 1.2; text-wrap: balance; }
  h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); font-weight: 800; letter-spacing: -0.01em; color: var(--band-ink); }
  h1 em { color: var(--color-gold); font-style: normal; }
  h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
  h2::after { content: ""; display: block; width: 32px; height: 2px; margin-top: 8px; background: var(--color-gold); }
  h3 { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header {
    display: flex; flex-direction: column; gap: 14px;
    padding: 24px 20px;
    border-radius: 16px;
    color: var(--band-ink);
    background-color: var(--color-dark);
    background-image: radial-gradient(ellipse at 70% 50%, var(--glow), transparent 70%);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 44px; height: auto; flex: none; color: var(--color-gold); }
  .overline { font-family: var(--font-head); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-gold); }
  .asof { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  .asof .t { font-size: 1.0625rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .asof .city { color: var(--band-muted); font-family: var(--font-head); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 8px; }
  .age { font-size: 0.875rem; color: var(--band-muted); }
  .banner { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--band-warn-line); background: var(--band-warn-bg); color: var(--band-warn-ink); font-size: 0.875rem; line-height: 1.5; }
  .banner.stale { background: var(--band-stale-bg); color: var(--band-stale-ink); border-color: var(--band-stale-line); font-weight: 600; }
  .banners { display: flex; flex-direction: column; gap: 8px; }
  .banners:empty { display: none; }

  section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .sub { display: flex; flex-direction: column; gap: 8px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 16px 20px; margin: 0; }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat dt { font-family: var(--font-head); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .stat dd { margin: 0; font-size: 1.0625rem; font-weight: 600; overflow-wrap: anywhere; }
  .note { font-size: 0.875rem; color: var(--muted); overflow-wrap: anywhere; line-height: 1.55; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 50px; border: 1px solid var(--line); font-family: var(--font-head); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.5; white-space: nowrap; background: var(--surface); color: var(--ink); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.ok::before, .pill.on::before { background: var(--pos); }
  .pill.warn::before { background: var(--neg); }

  .strength { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 2.6rem 1fr 4.6rem; align-items: center; gap: 8px; }
  .bar-row .ccy { font-family: var(--font-head); font-weight: 700; font-size: 0.8125rem; letter-spacing: 0.04em; }
  .bar-row .val { text-align: right; font-size: 0.8125rem; }
  .track { position: relative; height: 14px; }
  .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: 0.55; }
  .fill { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; }
  .fill.pos { left: 50%; background: var(--pos); }
  .fill.neg { right: 50%; background: var(--neg); border: 1px solid var(--neg-edge); }

  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.875rem; line-height: 1.45; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--font-head); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  tbody tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.wrap { white-space: normal; min-width: 12rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { display: inline-block; border: 1px solid var(--color-gold); color: var(--tag-ink); border-radius: 50px; padding: 1px 10px; font-family: var(--font-head); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.5; white-space: nowrap; }
  .empty { padding: 12px; color: var(--muted); font-size: 0.9375rem; }

  /* Trades potentiels: one card per idea (a .panel), one column at phone width. The side is
     a word (Haussier / Baissier); the dot of its pill only repeats it, in a token that
     reaches 3:1 on the card in both themes. */
  .ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 16px; }
  .idea { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .idea-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .idea-head .rank { font-family: var(--font-head); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .idea-head .name { font-size: 0.875rem; color: var(--muted); }
  .idea-title { font-size: 1.0625rem; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .pill.up::before { background: var(--pos); }
  .pill.down::before { background: var(--neg-edge); }
  .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 5.5rem), 1fr)); gap: 12px 16px; margin: 0; }
  .nums .stat.wide { grid-column: 1 / -1; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 7rem), 1fr)); gap: 10px 16px; margin: 0; }
  .facts .stat dd { font-size: 0.9375rem; font-weight: 500; }
  .size-msg { color: var(--ink); font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
  .why { margin: 0; padding: 0 0 0 1.1rem; font-size: 0.875rem; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
  .skipped { margin: 0; padding: 0 0 0 1.1rem; font-size: 0.875rem; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
  .callout { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-ink); font-size: 0.875rem; line-height: 1.55; font-weight: 600; overflow-wrap: anywhere; }
  .total { color: var(--ink); font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
  /* a plan already void (stop crossed since the close): the stale-band palette, bold, and
     the sentence itself says it, so the colour is never the only signal */
  .void { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--band-stale-line); background: var(--band-stale-bg); color: var(--band-stale-ink); font-size: 0.875rem; line-height: 1.55; font-weight: 700; overflow-wrap: anywhere; }

  ul.warnings { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  ul.warnings li { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-ink); font-size: 0.875rem; line-height: 1.55; overflow-wrap: anywhere; }
  footer { border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.875rem; color: var(--muted); }
  footer strong { color: var(--ink); font-weight: 600; }
</style>

<main>
  <header>
    <div class="brand">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" aria-hidden="true" focusable="false"><path d="M 12 90 C 18 82, 26 70, 34 56 C 40 44, 46 32, 52 22 C 56 16, 60 14, 64 18 C 68 22, 70 28, 66 34 C 62 40, 56 48, 58 54 C 60 60, 66 58, 72 52 C 78 46, 82 40, 86 42 C 90 44, 94 52, 100 64 C 104 72, 108 82, 112 90" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="overline">4884 · DATA</span>
    </div>
    <h1>Briefing <em>marchés</em></h1>
    <div class="asof" id="asof"></div>
    <div class="banners" id="banners"></div>
  </header>

  <section id="s-ideas" aria-labelledby="h-ideas">
    <h2 id="h-ideas">Trades potentiels</h2>
    <div id="ideas"></div>
  </section>

  <section id="s-resume" aria-labelledby="h-resume">
    <h2 id="h-resume">Résumé</h2>
    <div id="resume"></div>
  </section>

  <section id="s-force" aria-labelledby="h-force">
    <h2 id="h-force">Force des devises</h2>
    <div id="force"></div>
  </section>

  <section id="s-cal" aria-labelledby="h-cal">
    <h2 id="h-cal">Calendrier</h2>
    <div id="calendar"></div>
  </section>

  <section id="s-swing" aria-labelledby="h-swing">
    <h2 id="h-swing">Setups swing</h2>
    <div id="swing"></div>
  </section>

  <section id="s-plan" aria-labelledby="h-plan">
    <h2 id="h-plan">Plan du jour</h2>
    <div id="plan"></div>
  </section>

  <section id="s-warn" aria-labelledby="h-warn">
    <h2 id="h-warn">Avertissements</h2>
    <div id="warnings"></div>
  </section>

  <footer>
    <p id="disclaimer"><strong>Liste de graphiques qui ont matché une règle. Pas un conseil. Données Yahoo, retardées.</strong></p>
  </footer>
</main>

<!--BRIEFING_JSON-->

<script>
(function () {
  "use strict";

  var SETUP_LABELS = {
    breakout_20d: "Cassure du plus haut 20 j",
    bull_flag: "Drapeau haussier",
    reclaim_ma20: "Reprise de la moyenne 20 j",
    oversold: "Survente",
    oversold_bounce: "Rebond depuis la survente",
    breakdown_20d: "Cassure du plus bas 20 j",
    bear_flag: "Drapeau baissier",
    lose_ma20: "Perte de la moyenne 20 j",
    overbought: "Surachat",
    overbought_reject: "Rejet depuis le surachat"
  };
  var SIDE_LABELS = { haussier: "Haussier", baissier: "Baissier" };
  var IDEAS_NOTE = "Idées de plan mécaniques, issues des règles ci-dessous. À valider, pas des conseils. Prix de référence : dernière clôture.";
  var MSG_TO_CONFIRM = "Taille à confirmer chez le courtier";
  var MSG_TOO_WIDE = "Stop trop large pour le risque fixé";
  var MSG_OVER_CAP = "Risque cumulé au-dessus du plafond : n'ouvrez pas toutes ces idées en même temps.";
  var MSG_RISK_NOTE = "Le risque au stop vaut pour l'entrée affichée, sans écart d'ouverture ni glissement.";
  var MSG_VOID = "Stop déjà franchi depuis la clôture : plan caduc.";
  var MSG_REACHED = "Cible déjà atteinte depuis la clôture.";
  var TREND_LABELS = { up: "haussière", down: "baissière", mixed: "mixte" };
  var FAMILIES = [["forex", "Forex"], ["commodities", "Matières premières"], ["indices", "Indices"]];
  var STALE_HOURS = 12;

  function $(id) { return document.getElementById(id); }

  function h(tag, cls) {
    var el = document.createElement(tag);
    if (cls) { el.className = cls; }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) { continue; }
      el.append(c);
    }
    return el;
  }

  function has(v) { return v !== null && v !== undefined && v !== "" && !(typeof v === "number" && !isFinite(v)); }
  function text(v) { return has(v) ? String(v) : "n/a"; }
  function list(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === "object" && !Array.isArray(v) ? v : {}; }
  function fixed(v, d) { return typeof v === "number" && isFinite(v) ? v.toFixed(d) : "n/a"; }
  function signed(v, d) {
    if (typeof v !== "number" || !isFinite(v)) { return "n/a"; }
    return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
  }
  function price(v) {
    if (typeof v !== "number" || !isFinite(v)) { return "n/a"; }
    var a = Math.abs(v);
    return v.toFixed(a >= 100 ? 2 : a >= 10 ? 3 : 5);
  }
  function plural(n, one, many) { return n + " " + (n > 1 ? many : one); }

  function family(symbol) {
    if (/^[A-Z]{6}=X$/.test(symbol || "")) { return "forex"; }
    if (/=F$/.test(symbol || "")) { return "commodities"; }
    return "indices";
  }

  function empty(msg) { return h("p", "empty", msg); }

  function table(cols, rows) {
    var head = h("tr");
    cols.forEach(function (c) { head.append(h("th", c.cls, c.label)); });
    var body = h("tbody");
    rows.forEach(function (r) {
      var tr = h("tr");
      cols.forEach(function (c) {
        var v = c.cell(r);
        tr.append(h("td", c.cls, v));
      });
      body.append(tr);
    });
    var t = h("table", "", h("thead", "", head), body);
    return h("div", "scroll", t);
  }

  function stat(label, value, extra) {
    return h("div", "stat", h("dt", "", label), h("dd", "", value), extra || null);
  }

  /* ---------------------------------------------------------------- header */

  function renderHeader(b) {
    var asof = obj(b.as_of);
    var box = $("asof");
    box.replaceChildren(
      h("span", "", h("span", "city", "Paris"), h("span", "t", text(asof.paris))),
      h("span", "", h("span", "city", "New York"), h("span", "t", text(asof.new_york)))
    );
    var banners = [];
    var t = Date.parse(asof.iso);
    if (isFinite(t)) {
      var hours = (Date.now() - t) / 3600000;
      var ageText = hours < 1 ? "moins d’une heure" : hours < 48
        ? Math.floor(hours) + " h" : Math.floor(hours / 24) + " j";
      box.append(h("span", "age", "Briefing produit il y a " + ageText));
      if (hours >= STALE_HOURS) {
        banners.push(h("p", "banner stale", "Ce briefing date de plus de " + STALE_HOURS +
          " h. Relancer le briefing avant de s’en servir."));
      }
    }
    if (b.market_state === "closed_weekend") {
      banners.push(h("p", "banner", "Marché fermé (week-end) : les données sont les dernières clôtures."));
    }
    if (typeof b.data_age === "number" && isFinite(b.data_age)) {
      banners.push(h("p", "banner", "Cache périmé utilisé après un échec réseau : la donnée la plus ancienne a " +
        fixed(b.data_age / 3600, 1) + " h."));
    }
    if (obj(b.calendar).status === "unavailable") {
      banners.push(h("p", "banner", "Calendrier économique indisponible : les annonces ne sont pas vérifiées."));
    }
    $("banners").replaceChildren.apply($("banners"), banners);
  }

  /* ---------------------------------------------------------------- résumé */

  function clusterMessages(b) {
    return list(obj(b.swing).clusters).map(function (c) {
      var who = c.ccy === "USD" ? "le dollar (USD)" : text(c.ccy);
      return c.count + " des " + c.of + " signaux forex concernent " + who +
        " : signaux corrélés, pas indépendants.";
    });
  }

  function renderResume(b) {
    var counts = obj(b.counts);
    var failed = list(counts.failed);
    var hits = list(obj(b.swing).hits);
    var rows5 = list(obj(obj(b.strength).windows)["5d"]);
    var cal = obj(b.calendar);
    var ev24 = list(obj(b.day_plan).events_24h);

    var strengthTxt = "n/a";
    if (rows5.length) {
      var best = rows5[0], worst = rows5[rows5.length - 1];
      strengthTxt = "meilleure " + text(best.ccy) + " " + signed(best.score, 2) + " %, pire " +
        text(worst.ccy) + " " + signed(worst.score, 2) + " %";
    }
    var calTxt = cal.status === "unavailable" ? "calendrier indisponible, non vérifié"
      : ev24.length ? plural(ev24.length, "annonce", "annonces") : "aucune";

    var dl = h("dl", "stats",
      stat("Marché", b.market_state === "closed_weekend" ? "fermé (week-end)" : b.market_state === "open" ? "ouvert" : "n/a"),
      stat("Données reçues", text(counts.fetched) + " sur " + text(counts.requested),
        h("span", "note", plural(failed.length, "échec", "échecs"))),
      stat("Analysés", text(counts.scanned)),
      stat("Setups", plural(hits.length, "graphique a matché une règle", "graphiques ont matché une règle")),
      stat("Force des devises, 5 séances", strengthTxt),
      stat("Annonces à fort impact, 24 h", calTxt)
    );
    var out = [dl];
    clusterMessages(b).forEach(function (m) { out.push(h("p", "note", m)); });
    if (failed.length) {
      out.push(h("p", "note", "Sans données : " + failed.map(function (f) {
        return text(f.symbol);
      }).join(", ") + "."));
    }
    var box = $("resume");
    box.replaceChildren.apply(box, out);
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.gap = "12px";
  }

  /* ------------------------------------------------------- force des devises */

  function strengthPanel(title, rows) {
    var max = 0;
    rows.forEach(function (r) {
      if (typeof r.score === "number" && isFinite(r.score)) { max = Math.max(max, Math.abs(r.score)); }
    });
    var bars = h("div", "bars");
    rows.forEach(function (r) {
      var v = typeof r.score === "number" && isFinite(r.score) ? r.score : null;
      var fill = h("span", "fill " + (v !== null && v < 0 ? "neg" : "pos"));
      fill.style.width = v !== null && max > 0 ? (Math.abs(v) / max * 50).toFixed(1) + "%" : "0%";
      bars.append(h("div", "bar-row",
        h("span", "ccy", text(r.ccy)),
        h("span", "track", fill),
        h("span", "val num", signed(v, 2))));
    });
    return h("div", "panel", h("h3", "", title), bars);
  }

  function renderForce(b) {
    var w = obj(obj(b.strength).windows);
    var defs = [["1d", "1 séance"], ["5d", "5 séances"], ["20d", "20 séances"]];
    var panels = defs.filter(function (d) { return list(w[d[0]]).length; })
      .map(function (d) { return strengthPanel(d[1], list(w[d[0]])); });
    var box = $("force");
    if (!panels.length) { box.replaceChildren(empty("Aucune donnée de force des devises.")); return; }
    var grid = h("div", "strength");
    panels.forEach(function (p) { grid.append(p); });
    box.replaceChildren(grid, h("p", "note",
      "Variation logarithmique moyenne, en %, sur les paires forex de chaque devise (USD, EUR, GBP, JPY, CHF, AUD, NZD, CAD). " +
      "Barres vers la droite : devise plus forte que la moyenne ; vers la gauche : plus faible. Chaque colonne a sa propre échelle."));
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.gap = "12px";
  }

  /* -------------------------------------------------------------- calendrier */

  function eventKey(e) { return [e.utc, e.currency, e.title].join("|"); }

  function renderCalendar(b) {
    var cal = obj(b.calendar);
    var status = cal.status;
    var label = status === "ok" ? "à jour" : status === "partial" ? "partiel" : status === "unavailable" ? "indisponible" : "n/a";
    var pill = h("span", "pill " + (status === "ok" ? "ok" : "warn"), "Calendrier : " + label);
    var reason = has(cal.reason) ? h("span", "note", text(cal.reason)) : null;
    var status_row = h("div", "sub", pill, reason);

    var events = list(cal.events);
    var in24 = {};
    list(obj(b.day_plan).events_24h).forEach(function (e) { in24[eventKey(e)] = true; });
    var box = $("calendar");
    var body;
    if (!events.length) {
      body = empty(status === "unavailable" ? "Calendrier indisponible : aucune annonce vérifiée."
        : "Aucune annonce à fort impact sur les devises analysées.");
    } else {
      body = table([
        { label: "Date (Paris)", cell: function (e) { return text(e.date_paris); }, cls: "num" },
        { label: "Heure Paris", cell: function (e) { return text(e.time_paris); }, cls: "num" },
        { label: "Heure NY", cell: function (e) { return text(e.time_ny); }, cls: "num" },
        { label: "Devise", cell: function (e) { return text(e.currency); } },
        { label: "Annonce", cell: function (e) { return text(e.title); }, cls: "wrap" },
        { label: "Prévu", cell: function (e) { return text(e.forecast); }, cls: "num r" },
        { label: "Précédent", cell: function (e) { return text(e.previous); }, cls: "num r" },
        { label: "24 h", cell: function (e) { return in24[eventKey(e)] ? h("span", "pill on", "oui") : ""; } }
      ], events);
    }
    box.replaceChildren(status_row, body);
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.gap = "12px";
  }

  /* ------------------------------------------------------------ setups swing */

  function setupTags(setups) {
    var wrap = h("span", "tags");
    list(setups).forEach(function (s) { wrap.append(h("span", "tag", SETUP_LABELS[s] || text(s))); });
    return wrap;
  }

  function renderSwing(b) {
    var swing = obj(b.swing);
    var hits = list(swing.hits);
    var scanned = obj(b.counts).scanned;
    var box = $("swing");
    var out = [h("p", "", hits.length + (has(scanned) ? " sur " + scanned + " analysés" : "") +
      (hits.length > 1 ? " ont matché une règle." : " a matché une règle."))];
    clusterMessages(b).forEach(function (m) { out.push(h("p", "note", m)); });
    if (!hits.length) {
      out.push(empty("Aucun graphique n’a matché une règle sur cette analyse."));
    }
    FAMILIES.forEach(function (f) {
      var rows = hits.filter(function (x) { return family(x.symbol) === f[0]; });
      if (!rows.length) { return; }
      out.push(h("div", "sub", h("h3", "", f[1] + " (" + rows.length + ")"), table([
        { label: "Symbole", cell: function (x) { return text(x.symbol); } },
        { label: "Nom", cell: function (x) { return text(x.name); } },
        { label: "Dernier", cell: function (x) { return price(x.last); }, cls: "num r" },
        { label: "RSI", cell: function (x) { return fixed(x.rsi, 0); }, cls: "num r" },
        { label: "ATR %", cell: function (x) { return fixed(x.atr_pct, 2); }, cls: "num r" },
        { label: "Tendance", cell: function (x) { return TREND_LABELS[x.trend] || "n/a"; } },
        { label: "Règles", cell: function (x) { return setupTags(list(x.setups).concat(list(x.setups_short))); }, cls: "wrap" },
        { label: "Dernière barre", cell: function (x) { return text(x.last_bar_date); }, cls: "num" }
      ], rows)));
    });
    box.replaceChildren.apply(box, out);
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.gap = "12px";
  }

  /* --------------------------------------------------------- trades potentiels */

  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function trimmed(v, d) { return String(Number(v.toFixed(d))); }
  // thousands separated by a no-break space (U+00A0) so "62 000" never breaks
  function spaced(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0"); }
  function money(n) { return Number.isInteger(n) ? spaced(n) : spaced(Math.trunc(n)) + (Math.abs(n) % 1).toFixed(2).slice(1); }
  function count(v) { return typeof v === "number" && Number.isInteger(v) && v > 0 ? v : 0; }

  // the decimals carried by the idea (the tick of its plan); without them, the old rule:
  // forex 5 (3 on a JPY quote), every other instrument 2
  function planPrice(idea, v) {
    if (!isNum(v)) { return "n/a"; }
    var d = idea.decimals;
    if (typeof d === "number" && Number.isInteger(d) && d >= 0 && d <= 10) { return v.toFixed(d); }
    var s = String(idea.symbol || "");
    return v.toFixed(family(s) !== "forex" ? 2 : s.slice(3, 6) === "JPY" ? 3 : 5);
  }

  function sizeValue(size) {
    if (isNum(size.lots) && isNum(size.units)) {
      return fixed(size.lots, 2) + (size.lots < 2 ? " lot (" : " lots (") + spaced(size.units) + " unités)";
    }
    if (isNum(size.size)) { return trimmed(size.size, 6); }
    return "n/a";
  }

  // the part of a to_confirm note that does not repeat the headline
  function confirmDetail(note) {
    var s = String(note);
    var i = s.indexOf(": ");
    if (i >= 0 && s.slice(0, i).trim().toLowerCase() === MSG_TO_CONFIRM.toLowerCase()) {
      return s.slice(i + 2);
    }
    return s;
  }

  function ideaCard(idea, account) {
    var size = obj(idea.size);
    var side = idea.side === "haussier" ? " up" : idea.side === "baissier" ? " down" : "";
    var taille = null;
    if (size.status === "ok") {
      taille = stat("Taille", sizeValue(size));
      taille.className = "stat wide";
    }
    var closeDate = typeof idea.last_bar_date === "string" && idea.last_bar_date
      ? h("span", "note", "clôture du " + idea.last_bar_date) : null;
    var out = [
      h("div", "idea-head",
        h("span", "rank", "N° " + text(idea.rank)),
        h("h3", "idea-title", text(idea.symbol)),
        has(idea.name) ? h("span", "name", String(idea.name)) : null,
        h("span", "pill" + side, SIDE_LABELS[idea.side] || "n/a"))
    ];
    if (list(idea.setups).length) { out.push(setupTags(idea.setups)); }
    out.push(h("dl", "nums",
      stat("Entrée", planPrice(idea, idea.reference_price), closeDate),
      stat("Stop", planPrice(idea, idea.stop)),
      stat("Cible", planPrice(idea, idea.target)),
      taille));

    var since = obj(idea.since_close);
    if (isNum(since.last)) {
      out.push(h("p", "note", "Dernier cours 1 h : " + planPrice(idea, since.last)));
    }
    if (since.stop_crossed === true) { out.push(h("p", "void", MSG_VOID)); }
    if (since.target_crossed === true) { out.push(h("p", "callout", MSG_REACHED)); }

    var facts = [];
    if (size.status === "ok") {
      facts.push(stat("Risque au stop (USD)", fixed(size.risk_usd, 2)));
    }
    facts.push(stat("Rapport", isNum(idea.rr) ? "1:" + trimmed(idea.rr, 2) : "n/a"));
    if (size.status === "ok") {
      facts.push(stat("Levier", isNum(size.leverage) ? "×" + trimmed(size.leverage, 3) : "n/a"));
      if (isNum(size.pip_value_usd_per_lot)) {
        var pip = size.pip_value_usd_per_lot;
        facts.push(stat("Valeur du pip par lot", fixed(pip, Math.abs(pip) < 0.01 ? 4 : 2) + " USD"));
      }
    }
    out.push(h.apply(null, ["dl", "facts"].concat(facts)));

    if (size.status === "to_confirm") {
      out.push(h("p", "size-msg", MSG_TO_CONFIRM));
      if (has(size.note)) { out.push(h("p", "note", confirmDetail(size.note))); }
      if (isNum(account.risk_per_trade_usd)) {
        out.push(h("p", "note", "Risque prévu : " + fixed(account.risk_per_trade_usd, 2) + " USD"));
      }
    } else if (size.status === "too_wide") {
      out.push(h("p", "size-msg", MSG_TOO_WIDE));
      if (has(size.note) && String(size.note).toLowerCase() !== MSG_TOO_WIDE.toLowerCase()) {
        out.push(h("p", "note", String(size.note)));
      }
    } else if (size.status === "ok" && size.limited_by === "levier") {
      out.push(h("p", "note", "Taille limitée par le levier maximal."));
    }

    var why = list(idea.why);
    if (why.length) {
      var ul = h("ul", "why");
      why.forEach(function (w) { ul.append(h("li", "", text(w))); });
      out.push(h("div", "sub", h("h3", "", "Pourquoi"), ul));
    }
    return h.apply(null, ["article", "panel idea"].concat(out));
  }

  function accountText(account) {
    var cap = account.capital, usd = account.risk_per_trade_usd, lev = account.leverage_max;
    if (!isNum(cap) && !isNum(usd) && !isNum(lev)) { return ""; }
    var parts = ["Compte : " + (isNum(cap) ? money(cap) + " USD" : "n/a")];
    if (isNum(usd)) {
      parts.push("risque par idée " + (isNum(cap) && cap > 0 ? trimmed(usd / cap * 100, 4) + " % (" : "(") +
        fixed(usd, 2) + " USD)");
    }
    if (isNum(lev)) { parts.push("levier max " + trimmed(lev, 2) + ":1"); }
    return parts.join(" · ") + (account.source === "default" ? " (valeurs par défaut)" : "");
  }

  function overCapText(ti) {
    var n = ti.max_ideas_within_cap;
    if (typeof n !== "number" || !Number.isInteger(n) || n < 0) { return MSG_OVER_CAP; }
    return "Risque cumulé au-dessus du plafond : au plus " +
      (n > 1 ? n + " idées ouvertes" : n + " idée ouverte") + " en même temps.";
  }

  function renderIdeas(b) {
    var ti = obj(b.trade_ideas);
    var account = obj(ti.account);
    var ideas = list(ti.ideas).filter(function (i) { return i && typeof i === "object"; });
    var out = [h("p", "note", IDEAS_NOTE)];
    var accountLine = accountText(account);
    if (accountLine) { out.push(h("p", "note", accountLine)); }

    if (!ideas.length) {
      out.push(empty("Aucune idée de trade sur cette analyse."));
    } else {
      out.push(h("p", "note", MSG_RISK_NOTE));
      if (isNum(ti.total_risk_usd) && isNum(ti.total_risk_pct)) {
        out.push(h("p", "total", "Risque cumulé : " + fixed(ti.total_risk_usd, 2) + " USD (" +
          fixed(ti.total_risk_pct, 2) + " %)" +
          (isNum(ti.max_total_pct) ? " sur " + trimmed(ti.max_total_pct, 2) + " % autorisés" : "") +
          (isNum(ti.total_leverage) && ti.total_leverage > 0 ? " · levier cumulé ×" + fixed(ti.total_leverage, 2) : "")));
      }
      if (ti.over_cap === true) { out.push(h("p", "callout", overCapText(ti))); }
      var ties = count(ti.ties_at_cutoff);
      if (ties) {
        out.push(h("p", "note", (ties > 1 ? ties + " autres idées ont" : "1 autre idée a") +
          " le même score que la dernière affichée ; à score égal, l'ordre est alphabétique."));
      }
      var grid = h("div", "ideas");
      ideas.forEach(function (idea) { grid.append(ideaCard(idea, account)); });
      out.push(grid);
    }

    var skipped = list(ti.skipped).filter(function (s) { return s && typeof s === "object"; });
    if (skipped.length) {
      var ul = h("ul", "skipped");
      skipped.forEach(function (s) { ul.append(h("li", "", text(s.symbol) + " : " + text(s.reason))); });
      out.push(h("div", "sub", h("h3", "", "Idées écartées"), ul));
    }

    var box = $("ideas");
    box.replaceChildren.apply(box, out);
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.gap = "12px";
  }

  /* ------------------------------------------------------------ plan du jour */

  function renderPlan(b) {
    var plan = obj(b.day_plan);
    var sessions = list(plan.sessions);
    var levels = list(plan.levels);
    var out = [];

    if (sessions.length) {
      out.push(h("div", "sub", h("h3", "", "Sessions"), table([
        { label: "Session", cell: function (s) { return text(s.name); } },
        { label: "Ouverture Paris", cell: function (s) { return text(s.open_paris); }, cls: "num" },
        { label: "Fermeture Paris", cell: function (s) { return text(s.close_paris); }, cls: "num" },
        { label: "Ouverture NY", cell: function (s) { return text(s.open_ny); }, cls: "num" },
        { label: "Fermeture NY", cell: function (s) { return text(s.close_ny); }, cls: "num" },
        { label: "État", cell: function (s) {
          return s.active ? h("span", "pill on", "en cours") : h("span", "pill", "hors séance");
        } }
      ], sessions)));
    } else {
      out.push(h("div", "sub", h("h3", "", "Sessions"), empty("Sessions non disponibles.")));
    }

    if (levels.length) {
      var lv = function (k) { return function (r) { return price(r[k]); }; };
      var asia = function (k) {
        return function (r) {
          // the Asia range is final only from 07:00 UTC
          if (r.asia_complete === false && typeof r[k] === "number") {
            return h("span", "", price(r[k]), " ", h("span", "tag", "plage en cours"));
          }
          return price(r[k]);
        };
      };
      out.push(h("div", "sub", h("h3", "", "Niveaux à surveiller"), table([
        { label: "Symbole", cell: function (r) { return text(r.symbol); } },
        { label: "Nom", cell: function (r) { return text(r.name); } },
        { label: "Haut veille", cell: lv("prev_high"), cls: "num r" },
        { label: "Bas veille", cell: lv("prev_low"), cls: "num r" },
        { label: "Haut semaine préc.", cell: lv("week_high"), cls: "num r" },
        { label: "Bas semaine préc.", cell: lv("week_low"), cls: "num r" },
        { label: "Haut 20 séances", cell: lv("high20"), cls: "num r" },
        { label: "Bas 20 séances", cell: lv("low20"), cls: "num r" },
        { label: "Asie haut", cell: asia("asia_high"), cls: "num r" },
        { label: "Asie bas", cell: asia("asia_low"), cls: "num r" },
        { label: "Haut jour", cell: lv("day_high"), cls: "num r" },
        { label: "Bas jour", cell: lv("day_low"), cls: "num r" }
      ], levels), h("p", "note",
        "Asie : 00:00 à 07:00 UTC. Haut et bas du jour : depuis 00:00 UTC. n/a : barres 1 h absentes (matières premières, indices, week-end).")));
    } else {
      out.push(h("div", "sub", h("h3", "", "Niveaux à surveiller"), empty("Aucun niveau disponible.")));
    }

    var ev24 = list(plan.events_24h);
    if (ev24.length) {
      out.push(h("div", "sub", h("h3", "", "Annonces à fort impact, 24 h"), table([
        { label: "Date (Paris)", cell: function (e) { return text(e.date_paris); }, cls: "num" },
        { label: "Heure Paris", cell: function (e) { return text(e.time_paris); }, cls: "num" },
        { label: "Heure NY", cell: function (e) { return text(e.time_ny); }, cls: "num" },
        { label: "Devise", cell: function (e) { return text(e.currency); } },
        { label: "Annonce", cell: function (e) { return text(e.title); }, cls: "wrap" }
      ], ev24)));
    }
    var box = $("plan");
    box.replaceChildren.apply(box, out);
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.gap = "16px";
  }

  /* ----------------------------------------------------------- avertissements */

  function renderWarnings(b) {
    var ws = list(b.warnings);
    var box = $("warnings");
    if (!ws.length) { box.replaceChildren(empty("Aucun avertissement.")); return; }
    var ul = h("ul", "warnings");
    ws.forEach(function (w) { ul.append(h("li", "", text(w))); });
    box.replaceChildren(ul);
  }

  /* ------------------------------------------------------------------ start */

  function section(fn, b, id) {
    try { fn(b); }
    catch (e) {
      var box = $(id);
      if (box) { box.replaceChildren(empty("Section indisponible : données inattendues.")); }
    }
  }

  var b;
  try { b = JSON.parse($("briefing").textContent); }
  catch (e) { b = null; }
  if (!b || typeof b !== "object") {
    $("banners").replaceChildren(h("p", "banner stale", "Briefing illisible : relancer la commande page."));
    return;
  }
  section(renderHeader, b, "asof");
  section(renderIdeas, b, "ideas");
  section(renderResume, b, "resume");
  section(renderForce, b, "force");
  section(renderCalendar, b, "calendar");
  section(renderSwing, b, "swing");
  section(renderPlan, b, "plan");
  section(renderWarnings, b, "warnings");
})();
</script>
