# One-off probe of the Twelve Data free plan (gold, DAX40, Dow Jones). Run by hand from the Actions tab.
# Reads the TWELVE_DATA_API_KEY secret through env only; the script never prints it.
name: Feed probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Probe the price feed
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python3 research/live/feed_probe.py
